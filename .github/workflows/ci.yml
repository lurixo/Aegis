name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      heavy:
        description: Run the scheduled audit sweeps
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-heavy${{ (github.event_name == 'schedule' || github.event.inputs.heavy == 'true') && '1' || '0' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AEGIS_FULLDICT_DIR: ${{ github.workspace }}/app/src/main/assets
      AEGIS_AUDIT_FULL: "1"
      AEGIS_AUDIT_HEAVY: ${{ (github.event_name == 'schedule' || github.event.inputs.heavy == 'true') && '1' || '0' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run the dictionary pack builder tests
        run: python3 tools/release/test_build_dictionary_pack.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Resolve the dictionary pack sha256
        id: dictpack
        run: |
          sha256="$(python3 tools/fetch_test_dict.py --print-sha)"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the dictionary pack sha256 is not a 64-hex digest: '$sha256'" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Cache the full dictionary pack
        uses: actions/cache@v6
        with:
          path: build/test-dict-cache
          key: aegis-test-dict-${{ steps.dictpack.outputs.sha256 }}

      - name: Fetch the full dictionary pack for the decode tests
        run: python3 tools/fetch_test_dict.py

      - name: Build, test & lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug assembleDebug --stacktrace

      - name: Upload test & lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
