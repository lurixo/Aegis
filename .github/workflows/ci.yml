name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve the dictionary pack sha256
        id: dictpack
        run: echo "sha256=$(python3 tools/fetch_test_dict.py --print-sha)" >> "$GITHUB_OUTPUT"

      - name: Cache the full dictionary pack
        uses: actions/cache@v6
        with:
          path: build/test-dict-cache
          key: aegis-test-dict-${{ steps.dictpack.outputs.sha256 }}

      - name: Fetch the full dictionary pack for the decode tests
        run: python3 tools/fetch_test_dict.py

      - name: Build, test & lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug assembleDebug --stacktrace

      - name: Upload test & lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
