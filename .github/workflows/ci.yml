name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Verify the checked-in gradle-wrapper.jar against Gradle's published checksums,
      # so a tampered wrapper cannot run arbitrary code in CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Provide sdkmanager and accept the SDK licenses on the runner.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The project builds against compileSdk / targetSdk = 37 (Android SDK Platform "37.0")
      # and AGP 9.2 resolves its own build-tools (36.0.0 here; buildToolsVersion is not pinned).
      # Platform 37 is very new, so install it explicitly instead of relying on auto-provisioning.
      # If a hosted runner's sdkmanager channel does not yet carry "platforms;android-37.0",
      # this single step is where to adjust it (for example, install from a preview channel):
      # the compileSdk value itself lives in app/build.gradle.kts and is out of scope for CI.
      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      # Restore/save the Gradle dependency and build cache across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test & lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug assembleDebug --stacktrace

      # Keep the reports so a failing run is diagnosable.
      - name: Upload test & lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
